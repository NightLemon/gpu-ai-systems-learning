    - 0.3 成本结构: 00-industry-overview/03-economics.md
  - Ch01 计算机体系结构:
    - 概述: 01-computer-architecture/README.md
    - 1.1 CPU Cache 与 NUMA: 01-computer-architecture/01-cpu-cache-numa.md
    - 1.2 内存带宽: 01-computer-architecture/02-memory-bandwidth.md
    - 1.3 SIMD 向量化: 01-computer-architecture/03-simd-vectorization.md
